<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Attendance Records</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f4037, #99f2c8);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      flex-direction: column;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      padding: 35px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      text-align: center;
      width: 90%;
      max-width: 400px;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.02);
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      padding: 12px;
      margin: 10px 0;
      width: 100%;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.3);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(to right, #ff512f, #dd2476);
      color: white;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn:hover {
      background: linear-gradient(to right, #dd2476, #ff512f);
      transform: translateY(-2px);
    }

    .error {
      color: #ffcccc;
      margin-top: 10px;
      font-size: 14px;
    }

    .password-field {
      position: relative;
    }

    .toggle-visibility {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      user-select: none;
    }

    .forgot-password {
      margin-top: 10px;
      font-size: 14px;
      color: #e0e0e0;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.3s ease;
    }

    .forgot-password:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <img src="jis.jpg.png" alt="School Logo" class="logo">

  <div class="container">
    <h2>Enter Access Credentials</h2>
    <input type="text" id="accessId" placeholder="Enter ID (e.g., JISU/2024)">
    
    <div class="password-field">
      <input type="password" id="accessPass" placeholder="Enter Password">
      <span class="toggle-visibility" onclick="togglePassword()">🔒</span>
    </div>

    <button class="btn" onclick="checkCredentials()">Login</button>

    <div class="forgot-password" onclick="forgotPassword()">Forgot Password?</div>

    <div id="error" class="error"></div>
  </div>

  <script>
    function togglePassword() {
      const passInput = document.getElementById('accessPass');
      const toggleIcon = document.querySelector('.toggle-visibility');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleIcon.textContent = '🔓';
      } else {
        passInput.type = 'password';
        toggleIcon.textContent = '🔒';
      }
    }

    function checkCredentials() {
      const id = document.getElementById('accessId').value.trim();
      const pass = document.getElementById('accessPass').value.trim();
      const error = document.getElementById('error');

      if (id === "JISU/2024" && pass === "1234") {
        window.location.href = "records.html";
      } else {
        error.textContent = "Invalid ID or Password. Please try again.";
      }
    }

    function forgotPassword() {
      alert("Please contact the TEAM KNOX to reset your password.");
      // Or redirect to a separate page like:
      // window.location.href = "forgot-password.html";
    }
  </script>

</body>
</html>
